<!doctype html>
<!-- Shown by the desktop app while the backend starts; the window then navigates to the backend. -->
<html>
  <head>
    <meta charset="UTF-8" />
    <title>FS4 Patch Studio</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --fg: #171717; --muted: #737373; --accent: #863bff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --fg: #fafafa; --muted: #a3a3a3; } }
      html, body { height: 100%; margin: 0; }
      body { background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif;
             display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
      .spinner { width: 32px; height: 32px; border: 3px solid var(--muted); border-top-color: var(--accent);
                 border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      h1 { font-size: 20px; font-weight: 600; margin: 0; }
      p { color: var(--muted); margin: 0; max-width: 560px; text-align: center; word-break: break-all; }
    </style>
  </head>
  <body>
    <div class="spinner" id="spinner"></div>
    <h1>FS4 Patch Studio</h1>
    <p id="message"></p>
    <script>
      // this page lives outside the React app (and its i18n): its two strings are kept here
      const pt = (navigator.language || '').toLowerCase().startsWith('pt')
      document.getElementById('message').textContent = pt ? 'Iniciando…' : 'Starting…'
      window.showStartError = (logPath) => {
        document.getElementById('spinner').style.display = 'none'
        document.getElementById('message').textContent = (pt
          ? 'Não foi possível iniciar o app. Detalhes no log: '
          : 'The app could not start. Details in the log: ') + logPath
      }
    </script>
  </body>
</html>
